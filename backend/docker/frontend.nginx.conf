server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS interno de Docker (evita 502 tras recrear contenedor api).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ris_api_host api;

    # API Laravel (mismo origen :80 — evita firewall en :8000 en PCs de la LAN)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://$ris_api_host:8000$request_uri;
    }

    # Health Laravel (ruta /up fuera del prefijo /api)
    location = /up {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$ris_api_host:8000/up;
    }

    # Documentos escaneados (órdenes, encuestas) servidos por Laravel public/storage
    location /storage/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$ris_api_host:8000$request_uri;
    }

    # Frontend estático del RIS (SPA con navegación por archivos .html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear JS crítico para que despliegues se reflejen al instante.
    location ~ ^/js/(config|admin/admin|core/router|app)\.js$ {
        add_header Cache-Control "no-store";
    }

    client_max_body_size 64m;
}
