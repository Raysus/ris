server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend estático del RIS (SPA con navegación por archivos .html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el config.js para que RIS_BUILD/IP se actualicen al instante.
    location = /js/config.js {
        add_header Cache-Control "no-store";
    }

    client_max_body_size 64m;
}
