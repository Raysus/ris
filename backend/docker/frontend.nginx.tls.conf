server {
    listen 443 ssl http2;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ris_api_host api;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://$ris_api_host:8000$request_uri;
    }

    location = /up {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$ris_api_host:8000/up;
    }

    location /storage/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$ris_api_host:8000/storage/;
    }

    location = /ris-lan-cert.pem {
        default_type application/x-pem-file;
        alias /etc/nginx/certs/fullchain.pem;
        add_header Content-Disposition 'attachment; filename="ris-lan-cert.pem"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/js/(config|admin/admin|core/router|app)\.js$ {
        add_header Cache-Control "no-store";
    }

    client_max_body_size 64m;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
