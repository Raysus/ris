# =====================================================================
# HealthTiCloud RIS — Stack para despliegue en LAN (Windows + Docker Desktop)
#
#   PACS/Orthanc y visor OHIF NO se levantan en local: la API se conecta al
#   Orthanc de la NUBE (ORTHANC_URL en .env) y el visor usa el de la nube
#   (VIEWER_URL en .env). Recomendado vía Tailscale (ver guía).
#
#   Uso:
#     copy .env.lan.example .env   (y editar IP del servidor + ORTHANC_URL nube)
#     docker compose -f docker-compose.lan.yml up -d --build
#
#   Detalle: docs/GUIA_INSTALACION_LABORATORIO.md
# =====================================================================

services:
  pgsql:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ris_db}
      POSTGRES_USER: ${DB_USERNAME:-risuserdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-GHeaO9jCWHO9LulGk8vbetnB}
    volumes:
      - ris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-risuserdb} -d ${DB_DATABASE:-ris_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - ris-redis:/data

  # PACS/Orthanc y visor: en la NUBE (no se levantan aquí).
  #   ORTHANC_URL y VIEWER_URL apuntan a la nube en .env (recomendado vía Tailscale).

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: serve
    ports:
      - "8000:8000"
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - ris-storage:/var/www/html/storage/app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: queue
    depends_on:
      - api
    volumes:
      - ris-storage:/var/www/html/storage/app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: scheduler
    depends_on:
      - api

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./docker/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ris-db:
  ris-redis:
  ris-storage:
