<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HealthTICloud RIS</title>
    <meta name="theme-color" content="#101860">
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="assets/brand/healthticloud-logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/brand/healthticloud-logo.png">
    <link rel="stylesheet" href="assets/lib/bootstrap/5.3.2/bootstrap.min.css">
    <link rel="stylesheet" href="assets/lib/bootstrap-icons/1.11.1/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css?v=20260720layout3">
    <script src="assets/lib/jquery/jquery-3.7.1.min.js"></script>
    <script src="assets/lib/fullcalendar/6.1.11/scheduler.index.global.min.js"></script>
    <script src="assets/lib/fullcalendar/6.1.11/list.index.global.min.js"></script>
    <script src="assets/lib/fullcalendar/6.1.11/locales-all.global.min.js"></script>
    <script src="assets/lib/bootstrap/5.3.2/bootstrap.bundle.min.js"></script>
    <script src="assets/lib/moment/2.29.4/moment.min.js"></script>
    <script src="assets/lib/html2pdf/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="assets/lib/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script src="assets/lib/chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="assets/lib/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
    <a href="#appContent" class="skip-link visually-hidden-focusable">Saltar al contenido principal</a>

    <div class="app">
        <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

        <aside class="sidebar" id="sidebar" aria-label="Menú principal">
            <div class="logo">
                <a href="#" class="brand-link" data-page="agenda" aria-label="HealthTICloud RIS — inicio">
                    <img src="assets/brand/healthticloud-logo-blanco.png" alt="HealthTICloud" class="brand-logo brand-logo--full" width="210" height="48">
                    <img src="assets/brand/favicon.svg" alt="" class="brand-logo brand-logo--icon" width="40" height="40" aria-hidden="true">
                </a>
            </div>

            <nav aria-label="Módulos del sistema">
                <a href="#" data-page="agenda"><i class="bi bi-calendar3 me-2" aria-hidden="true"></i> <span>Agenda</span></a>
                <a href="#" data-page="worklist"><i class="bi bi-list-ul me-2" aria-hidden="true"></i> <span>Lista de trabajo</span></a>
                <a href="#" data-page="atencion" class="d-none"><i class="bi bi-door-open me-2" aria-hidden="true"></i> <span>Atención en salas</span></a>
                <a href="#" data-page="radiologist"><i class="bi bi-person-video me-2" aria-hidden="true"></i> <span>Radiólogo</span></a>
                <a href="#" data-page="transcription"><i class="bi bi-mic me-2" aria-hidden="true"></i> <span>Transcripción</span></a>
                <a href="#" data-page="validation"><i class="bi bi-check2-all me-2" aria-hidden="true"></i> <span>Validación</span></a>
                <a href="#" data-page="entrega"><i class="bi bi-box-seam me-2" aria-hidden="true"></i> <span>Entrega/Retiro</span></a>
                <a href="#" data-page="admin"><i class="bi bi-gear-fill me-2" aria-hidden="true"></i> <span>Administración</span></a>
                <a href="#" data-page="dashboard"><i class="bi bi-speedometer2 me-2" aria-hidden="true"></i> <span>Panel</span></a>
            </nav>
        </aside>

        <div class="main">
            <header class="topbar" role="banner">
                <div class="left">
                    <button id="toggleSidebar" class="btn btn-light btn-sm shadow-sm" type="button"
                        aria-label="Mostrar u ocultar menú lateral" aria-expanded="true" aria-controls="sidebar">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="right d-flex align-items-center gap-3">
                    <div class="d-none me-3" id="navLabSelectorContainer">
                        <label for="navLabSelector" class="visually-hidden">Laboratorio activo</label>
                        <div class="input-group input-group-sm shadow-sm">
                            <span class="input-group-text bg-white border-primary text-primary">
                                <i class="bi bi-building" aria-hidden="true"></i>
                            </span>
                            <select class="form-select border-primary fw-bold text-primary bg-light" id="navLabSelector"
                                style="cursor: pointer;">
                            </select>
                        </div>
                    </div>
                    <div class="text-end lh-1">
                        <span id="userNameDisplay" class="fw-bold text-primary small d-block">Cargando...</span>
                        <span id="userRoleDisplay" class="user-role-display text-muted">Rol</span>
                    </div>
                    <button id="darkMode" class="btn btn-outline-secondary btn-sm rounded-circle shadow-sm" type="button"
                        aria-label="Alternar modo oscuro">
                        <i class="bi bi-moon-stars" aria-hidden="true"></i>
                    </button>
                    <div class="vr" aria-hidden="true"></div>
                    <button id="btnLogout" class="btn btn-outline-secondary btn-sm rounded-circle shadow-sm" type="button"
                        aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <main id="appContent" role="main" tabindex="-1"></main>
        </div>
    </div>

    <div id="globalLoader" aria-live="polite" aria-busy="true">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando…</span>
            </div>
        </div>
    </div>

    <!-- Modal confirmación reutilizable -->
    <div class="modal fade" id="risConfirmModal" tabindex="-1" aria-labelledby="risConfirmTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="risConfirmTitle">Confirmar acción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="risConfirmMessage" class="mb-0 text-secondary"></p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light fw-bold" id="risConfirmCancelBtn" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary fw-bold" id="risConfirmBtn">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal prompt reutilizable (texto libre) -->
    <div class="modal fade" id="risPromptModal" tabindex="-1" aria-labelledby="risPromptTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="risPromptTitle">Ingrese información</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="risPromptMessage" class="text-secondary mb-2"></p>
                    <label for="risPromptInput" class="form-label visually-hidden">Respuesta</label>
                    <textarea id="risPromptInput" class="form-control" rows="3" placeholder="Escriba aquí..."></textarea>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light fw-bold" id="risPromptCancelBtn" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary fw-bold" id="risPromptConfirmBtn">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal alerta reutilizable -->
    <div class="modal fade" id="risAlertModal" tabindex="-1" aria-labelledby="risAlertTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="risAlertTitle">Aviso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="risAlertMessage" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary fw-bold" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/core/escape.js?v=20260719a"></script>
    <script src="js/core/ris-ui-kit.js?v=20260719d"></script>
    <script src="js/config.js?v=20260706o"></script>
    <script src="js/workflow/browser-dictation.js?v=20260719a"></script>
    <script src="js/core/labProfile.js?v=20260624a"></script>
    <script src="js/core/ui.js?v=20260719c"></script>
    <script src="js/core/viewer.js?v=20260706e"></script>
    <script src="js/core/router.js?v=20260624a"></script>
    <script src="js/app.js?v=20260719c"></script>
</body>

</html>
