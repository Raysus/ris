<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HealthTiCloud</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-title" content="RIS PRO">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.11/index.global.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/es.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="bi bi-shield-plus"></i> <span>RIS Pro</span>
            </div>

            <nav>

                <a data-page="agenda">
                    <i class="bi bi-calendar3 me-2"></i> <span>Agenda</span>
                </a>
                <a data-page="worklist">
                    <i class="bi bi-list-ul me-2"></i> <span>Worklist</span>
                </a>
                <a data-page="radiologist">
                    <i class="bi bi-person-video me-2"></i> <span>Radiólogo</span>
                </a>
                <a data-page="transcription">
                    <i class="bi bi-mic me-2"></i> <span>Transcripción</span>
                </a>
                <a data-page="validation">
                    <i class="bi bi-check2-all me-2"></i> <span>Validación</span>
                </a>
                <a data-page="entrega">
                    <i class="bi bi-box-seam me-2"></i> <span>Entrega/Retiro</span>
                </a>
                <a data-page="admin">
                    <i class="bi bi-gear-fill me-2 text-secondary"></i> <span>Administración</span>
                </a>
                <a data-page="dashboard">
                    <i class="bi bi-speedometer2 me-2 text-secondary"></i> <span>Dashboard</span>
                </a>
            </nav>
        </aside>

        <div class="main">
            <header class="topbar">
                <div class="left">
                    <button id="toggleSidebar" class="btn btn-light btn-sm shadow-sm">
                        <i class="bi bi-list"></i>
                    </button>
                </div>
                <div class="right d-flex align-items-center gap-3">
                    <div class="d-none me-3" id="navLabSelectorContainer">
                        <div class="input-group input-group-sm shadow-sm">
                            <span class="input-group-text bg-white border-primary text-primary">
                                <i class="bi bi-building"></i>
                            </span>
                            <select class="form-select border-primary fw-bold text-primary bg-light" id="navLabSelector"
                                style="cursor: pointer;">
                            </select>
                        </div>
                    </div>
                    <div class="text-end lh-1">
                        <span id="userNameDisplay" class="fw-bold text-primary small d-block">Cargando...</span>
                        <span id="userRoleDisplay" class="text-muted"
                            style="font-size: 0.65rem; text-transform: uppercase;">Rol</span>
                    </div>

                    <button id="darkMode" class="btn btn-outline-secondary btn-sm rounded-circle shadow-sm">
                        <i class="bi bi-moon-stars"></i>
                    </button>

                    <div class="vr"></div> <button id="btnLogout" class="btn btn-danger btn-sm rounded-circle shadow-sm"
                        title="Cerrar Sesión">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </header>

            <section id="appContent"></section>
        </div>
    </div>

    <div id="globalLoader">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>

    <script src="js/core/storage.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/ui.js"></script>

    <script src="js/workflow/agenda.js"></script>
    <script src="js/workflow/worklist.js"></script>
    <script src="js/workflow/radiologist.js"></script>
    <script src="js/workflow/transcription.js"></script>
    <script src="js/workflow/validation.js"></script>
    <script src="js/workflow/entrega.js"></script>
    <script src="js/dashboard/dashboard.js"></script>
    <script src="js/dicom/viewer.js"></script>
    <script src="js/admin/admin.js"></script>

    <script src="js/integrations/pacs.js"></script>
    <script src="js/integrations/hl7.js"></script>


    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registrado con éxito. Scope:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('❌ Error al registrar el Service Worker:', error);
                    });
            });
        } else {
            console.warn('Este navegador no soporta Service Workers.');
        }
    </script>
</body>

</html>
