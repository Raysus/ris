<div class="container-fluid p-4 h-100 bg-light">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-primary mb-0"><i class="bi bi-graph-up-arrow me-2"></i>Centro de Comando RIS</h3>
            <small class="text-muted">Métricas y flujo operativo</small>
        </div>
        <div class="d-flex gap-2">
            <input type="date" id="filtroFechaDash" class="form-control shadow-sm" onchange="actualizarMetricas()">
            <div class="badge bg-white text-dark border p-2 shadow-sm fs-6 d-flex align-items-center">
                <i class="bi bi-calendar-event me-2"></i><span id="dashFechaActual">--/--/----</span>
            </div>
        </div>
    </div>



    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm border-start border-4 border-primary h-100">
                <div class="card-body">
                    <h6 class="text-muted fw-bold mb-1">Pacientes Agendados Hoy</h6>
                    <h2 class="fw-bold text-dark mb-0" id="kpiPacientes">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm border-start border-4 border-info h-100">
                <div class="card-body">
                    <h6 class="text-muted fw-bold mb-1">Exámenes Realizados</h6>
                    <h2 class="fw-bold text-dark mb-0" id="kpiExamenes">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm border-start border-4 border-warning h-100">
                <div class="card-body">
                    <h6 class="text-muted fw-bold mb-1">Informes Pendientes (Bandejas)</h6>
                    <h2 class="fw-bold text-dark mb-0" id="kpiInformes">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm border-start border-4 border-success h-100">
                <div class="card-body">
                    <h6 class="text-muted fw-bold mb-1">Ingresos de la Fecha</h6>
                    <h2 class="fw-bold text-success mb-0" id="kpiIngresos">$0</h2>
                    <small id="kpiTendencia" class="fw-bold"></small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm border-start border-4 border-secondary h-100">
                <div class="card-body">
                    <h6 class="text-muted fw-bold mb-1">Tiempo Prom. Entrega (TAT)</h6>
                    <h2 class="fw-bold text-dark mb-0"><span id="kpiTat">0</span> <small class="fs-6">min</small></h2>
                </div>
            </div>
        </div>
    </div>

    <div id="dashError" class="alert alert-danger d-none mb-3" role="alert"></div>

    <div class="row mt-3 d-none" id="containerAlertasOperativas">
        <div class="col-12" id="listaAlertasOperativas"></div>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3 border-bottom-0">
                    <h6 class="fw-bold text-dark mb-0"><i class="bi bi-pie-chart-fill text-primary me-2"></i>Estado del
                        Flujo Clínico</h6>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center"
                    style="position: relative; height: 300px;">
                    <canvas id="chartEstados" aria-label="Gráfico de estado del flujo clínico" role="img"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card border-0 shadow-sm h-100">
                <div
                    class="card-header bg-white py-3 border-bottom-0 d-flex justify-content-between align-items-center">
                    <h6 class="fw-bold text-dark mb-0"><i class="bi bi-bar-chart-fill text-info me-2"></i>Producción por
                        Modalidad (Equipos)</h6>
                </div>
                <div class="card-body" style="position: relative; height: 300px;">
                    <canvas id="chartModalidades" aria-label="Gráfico de producción por modalidad" role="img"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
