<div class="container-fluid p-3">

    <div id="alertasInsumosContainer" class="mb-3"></div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <div class="ris-page-header mb-0">
                <div class="ris-page-header__main">
                    <h1 class="ris-page-title" id="atencionPageTitle"><i class="bi bi-list-task me-2" aria-hidden="true"></i>Lista de trabajo</h1>
                    <p class="ris-page-subtitle mb-0" id="atencionPageSubtitle">Pacientes confirmados en agenda — envío DICOM a modalidades</p>
                </div>
                <div class="ris-page-header__actions ris-toolbar worklist-toolbar ris-module-toolbar">
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="cargarWorklistDesdeServidor()"
                        aria-label="Actualizar lista de trabajo">
                        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                    </button>
                    <div id="filtroEquiposWorklist" class="d-flex flex-wrap gap-2 align-items-center worklist-filter-equipos"
                        role="group" aria-label="Filtrar por equipo">
                        <span class="small text-muted">Equipos:</span>
                    </div>
                    <label for="searchPatient" class="visually-hidden">Buscar paciente</label>
                    <input type="search" id="searchPatient" class="form-control form-control-sm search-patient-input"
                        placeholder="Buscar RUT o Nombre..." onkeyup="renderWorklist()" aria-label="Buscar paciente por RUT o nombre">
                </div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive ris-table-scroll">
                <table class="table table-hover align-middle mb-0 ris-data-table" id="worklistTable">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Paciente / RUT</th>
                            <th class="wl-col-cadena">Estudios</th>
                            <th class="wl-col-salas">Salas</th>
                            <th class="text-center">Prioridad</th>
                            <th class="text-center wl-col-estado">Estado</th>
                            <th class="text-center ris-col-actions">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
