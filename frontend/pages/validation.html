<div class="container-fluid p-3 h-100">
    <div class="row h-100">

        <div class="col-md-3 h-100 d-flex flex-column">
            <div class="card shadow-sm border-0 flex-grow-1">
                <div class="card-header bg-dark text-white py-3">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-pen me-2"></i>Bandeja de Firma</h6>
                    <small class="opacity-75">Informes listos para validar (<span id="badgeParaFirma">0</span>)</small>
                    <div class="mt-2" data-ris-exam-date-filter>
                        <label class="small fw-bold opacity-75 mb-1 d-block"><i class="bi bi-calendar3 me-1"></i>Fecha examen</label>
                        <div class="d-flex flex-wrap gap-1 align-items-center">
                            <input type="date" data-ris-exam-date-input class="form-control form-control-sm bg-dark text-white border-secondary" style="max-width:9.5rem">
                            <button type="button" class="btn btn-sm btn-outline-light" data-ris-exam-date-preset="today">Hoy</button>
                            <button type="button" class="btn btn-sm btn-outline-light" data-ris-exam-date-preset="tomorrow">Mañana</button>
                            <button type="button" class="btn btn-sm btn-outline-light" data-ris-exam-date-preset="all">Todos</button>
                        </div>
                    </div>
                </div>
                <div class="list-group list-group-flush overflow-auto flex-grow-1" id="validationStudies"
                    style="max-height: calc(100vh - 240px);">
                </div>
            </div>
        </div>

        <div class="col-md-9 h-100 d-flex flex-column">
            <div class="card shadow-sm border-0 flex-grow-1">

                <div class="card-header bg-white py-3 border-bottom">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 w-100">
                        <div id="infoPacienteValidacion" class="d-none flex-grow-1 min-w-0">
                            <h5 class="mb-1 fw-bold text-dark" id="valPatientName">Nombre Paciente</h5>
                            <div class="text-muted small">
                                RUT: <span id="valPatientRut"></span> |
                                A.N.: <span id="valPatientAcc"></span>
                            </div>
                        </div>
                        <div class="text-muted p-3 text-center flex-grow-1" id="placeholderValidacion">
                            <i class="bi bi-pen fs-1 d-block mb-3"></i>
                            Seleccione un informe para validar y firmar.
                        </div>

                        <div class="d-flex gap-2 ms-auto" id="toolbarValidacion" style="display: none !important;">
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-secondary fw-bold shadow-sm" id="btnVisorPacsValidacion"
                                onclick="abrirVisorPACSValidacion()" disabled title="Bridge → URL custom → OHIF">
                                <i class="bi bi-display me-1"></i> VISOR PACS
                            </button>
                            <button class="btn btn-sm btn-outline-primary fw-bold shadow-sm" id="btnVisorOhifValidacion"
                                onclick="abrirVisorSoloOHIFValidacion()" disabled title="Solo visor web OHIF">
                                <i class="bi bi-cloud me-1"></i> OHIF
                            </button>
                        </div>
                        <button class="btn btn-sm btn-outline-warning text-dark fw-bold shadow-sm"
                            id="btnEditarValidacion" onclick="habilitarEdicionValidacion()" disabled>
                            <i class="bi bi-pencil-square me-1"></i> CORREGIR TYPO
                        </button>
                        <button class="btn btn-sm btn-outline-info fw-bold shadow-sm" id="btnPreview"
                            onclick="generarVistaPrevia()" disabled>
                            <i class="bi bi-file-pdf me-1"></i> VISTA PREVIA
                        </button>
                        </div>
                    </div>
                </div>

                <div class="card-body d-flex flex-column bg-light p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div id="examenesValidacion" class="mb-2 w-100"></div>
                    </div>

                    <div class="flex-grow-1 d-flex flex-column bg-white border rounded shadow-sm p-4 overflow-auto"
                        id="papelInforme">

                        <div id="reportLetterIntro" class="ris-report-letter-intro"></div>

                        <textarea id="finalReportText" class="form-control border-0 flex-grow-1 p-0 mt-2 mb-2"
                            style="resize: none; font-family: 'Times New Roman', Times, serif; font-size: 12pt; line-height: 1.45; background-color: transparent;"
                            disabled></textarea>

                        <div id="reportLetterFooter" class="ris-report-letter-footer"></div>
                    </div>

                </div>

                <div class="card-footer bg-white py-3 d-flex justify-content-between border-top">
                    <button class="btn btn-outline-danger fw-bold" id="btnRechazar" onclick="rechazarInforme()"
                        disabled>
                        <i class="bi bi-x-circle me-1"></i> Rechazar y Devolver a transcripción
                    </button>
                    <button class="btn btn-success fw-bold px-5 shadow" id="btnAprobar" onclick="firmarInforme()"
                        disabled>
                        <i class="bi bi-pen-fill me-1"></i> APROBAR Y FIRMAR INFORME
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
