<div class="container-fluid p-3 h-100">
    <div class="row h-100">
        <div class="col-md-3 h-100 d-flex flex-column">
            <div class="card shadow-sm border-0 flex-grow-1">
                <div class="card-header bg-dark text-white py-3">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-headphones me-2"></i>Audios Pendientes</h6>
                    <small class="opacity-75">Dictados por transcribir (<span id="contadorAudios">0</span>)</small>
                </div>
                <div class="list-group list-group-flush overflow-auto flex-grow-1" id="listaTranscripcion"
                    style="max-height: calc(100vh - 180px);">
                </div>
            </div>
        </div>

        <div class="col-md-9 h-100 d-flex flex-column">
            <div class="card shadow-sm border-0 flex-grow-1">
                <div class="card-header bg-white py-3 border-bottom" id="infoPacienteTranscripcion">
                    <div class="text-center text-muted p-4">
                        <i class="bi bi-headphones fs-1 d-block mb-3"></i>
                        Seleccione un dictado para comenzar.
                    </div>
                </div>

                <div class="card-body d-flex flex-column bg-light p-3">
                    <div class="card bg-white border-primary border-opacity-25 shadow-sm mb-3">
                        <div class="card-body p-3">
                            <h6 class="fw-bold text-primary mb-3"><i class="bi bi-mic-fill me-2"></i>Dictado del
                                Radiólogo</h6>
                            <audio id="audioDictado" preload="auto"></audio>
                            <div class="d-flex align-items-center gap-3">
                                <button class="btn btn-primary rounded-circle shadow-sm" id="btnPlayPause"
                                    onclick="togglePlayPause()" style="width: 50px; height: 50px;">
                                    <i class="bi bi-play-fill fs-3" id="iconPlayPause" style="margin-left: 4px;"></i>
                                </button>
                                <div class="btn-group shadow-sm">
                                    <button class="btn btn-outline-secondary" onclick="skipAudio(-5)">-5s</button>
                                    <button class="btn btn-outline-secondary" onclick="skipAudio(5)">+5s</button>
                                </div>
                                <div class="flex-grow-1 d-flex align-items-center gap-2">
                                    <span id="timeCurrent" class="small fw-bold">0:00</span>
                                    <input type="range" class="form-range" id="audioProgress" value="0" step="0.1"
                                        oninput="seekAudio()">
                                    <span id="timeTotal" class="small fw-bold">0:00</span>
                                </div>
                                <div class="dropdown">
                                    <button class="btn btn-dark dropdown-toggle shadow-sm" type="button"
                                        data-bs-toggle="dropdown">
                                        <i class="bi bi-speedometer2 me-1"></i> <span id="speedIndicator">1.0x</span>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow">
                                        <li><a class="dropdown-item" href="#" onclick="setAudioSpeed(0.5)">0.5x</a></li>
                                        <li><a class="dropdown-item fw-bold text-primary" href="#"
                                                onclick="setAudioSpeed(1.0)">1.0x</a></li>
                                        <li><a class="dropdown-item" href="#" onclick="setAudioSpeed(1.5)">1.5x</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                        <div class="d-flex align-items-center gap-2">
                            <div class="dropdown">
                                <button id="btnPlantillaTrans"
                                    class="btn btn-sm btn-outline-primary dropdown-toggle fw-bold bg-white"
                                    type="button" data-bs-toggle="dropdown" disabled>
                                    <i class="bi bi-journal-text me-1"></i> Insertar Plantilla
                                </button>
                                <ul class="dropdown-menu shadow-sm" id="dropdownPlantillasTrans"
                                    style="max-height: 300px; overflow-y: auto;">
                                    <li><span class="dropdown-item text-muted">Cargando...</span></li>
                                </ul>
                            </div>
                            <small id="autoSaveIndTrans" class="text-muted fw-bold" style="display: none;">
                                <i class="bi bi-cloud-arrow-up text-success me-1"></i>Guardado
                            </small>
                        </div>
                        <div class="small text-muted bg-white px-2 py-1 rounded border shadow-sm">
                            <i class="bi bi-keyboard me-1"></i> <b>F4</b>: Play/Pausa | <b>F2</b>: -5s
                        </div>
                    </div>

                    <div id="listaExamenesTranscripcion" class="mb-2 d-flex gap-2 flex-wrap"></div>
                    <textarea id="textoTranscripcion" class="form-control border-0 shadow-sm flex-grow-1 p-3"
                        style="resize: none; font-size: 1rem; line-height: 1.5;" placeholder="Transcriba aquí..."
                        disabled></textarea>
                </div>

                <div class="card-footer bg-white py-3 d-flex justify-content-between border-top">
                    <button class="btn btn-outline-danger fw-bold" id="btnDevolverAudio"
                        onclick="devolverAudioAlMedico()" disabled>
                        <i class="bi bi-exclamation-triangle me-1"></i> Reportar Audio
                    </button>
                    <button class="btn btn-success fw-bold px-5 shadow" id="btnEnviarValidacion"
                        onclick="enviarAValidacion()" disabled>
                        <i class="bi bi-check-circle me-1"></i> ENVIAR A FIRMA
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
