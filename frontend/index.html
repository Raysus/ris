<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HealthTICloud</title>
    <meta name="theme-color" content="#101860">
    <link rel="icon" href="assets/brand/favicon.png" type="image/png" sizes="16x16">
    <link rel="icon" href="assets/brand/healthticloud-logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/brand/healthticloud-logo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/style.css?v=20260601">
</head>

<body class="login-page">

    <div class="card login-card shadow-lg">
        <div class="login-header">
            <div class="login-brand-panel">
                <img src="assets/brand/healthticloud-logo.png?v=20260601" alt="HealthTICloud" class="login-brand-img" width="300" height="72" decoding="async">
            </div>
            <p class="login-subtitle mb-0">Sistema de Información Radiológica</p>
        </div>

        <div class="card-body p-4 pt-2">
            <div id="loginError" class="alert alert-danger d-none small p-2 text-center fw-bold rounded-3"></div>

            <div class="mb-3">
                <label class="small fw-bold text-muted-modern mb-1" for="username">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                    <input id="username" type="text" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="small fw-bold text-muted-modern mb-1" for="password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                    <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                    <label class="form-check-label small text-muted-modern" for="rememberMe">
                        Recordarme
                    </label>
                </div>
                <a href="#" class="small text-primary fw-bold" onclick="mostrarModalRecuperar()">¿Olvidó su
                    contraseña?</a>
            </div>

            <button id="loginBtn" class="btn btn-primary login-btn w-100 shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> INICIAR SESIÓN
            </button>
        </div>

        <div class="card-footer login-footer border-0 text-center pb-3 pt-0">
            <small>© 2026 Procomed. Todos los derechos reservados.</small>
        </div>
    </div>
    <div class="modal fade" id="modalRecuperarPassword" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h6 class="modal-title fw-bold">Recuperar Acceso</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">Ingrese su correo oficial para recibir instrucciones.</p>
                    <input type="email" id="emailRecuperar" class="form-control form-control-sm"
                        placeholder="usuario@clinica.cl">
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-sm btn-primary w-100 fw-bold"
                        onclick="enviarSolicitudRecuperacion()">
                        Enviar Instrucciones
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js?v=20260528"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/auth.js?v=20260528"></script>

</body>

</html>
