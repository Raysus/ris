<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HealthTICloud</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Estilos modernos y limpios para el login */
        body {
            background-color: #f0f4f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: none;
            overflow: hidden;
            background: #ffffff;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            background: #ffffff;
            padding: 3rem 2rem 1rem;
            text-align: center;
            border-bottom: none;
        }

        .login-logo {
            font-size: 3rem;
            color: #2ec4b6;
            /* Un color turquesa/verde moderno */
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e6ed;
            background-color: #f9fafb;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(46, 196, 182, 0.1);
            border-color: #2ec4b6;
            background-color: #ffffff;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            background-color: #f9fafb;
            border: 1px solid #e0e6ed;
            color: #9ca3af;
        }

        .login-btn {
            background-color: #2ec4b6;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #27a79a;
        }

        .text-muted-modern {
            color: #718096;
        }

        .forgot-password {
            color: #2ec4b6;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .sso-btn {
            border: 1px solid #e0e6ed;
            border-radius: 10px;
            background: #ffffff;
            color: #4a5568;
            transition: background-color 0.2s;
        }

        .sso-btn:hover {
            background-color: #f9fafb;
        }
    </style>
</head>

<body>

    <div class="card login-card">
        <div class="login-header">
            <i class="bi bi-heart-pulse login-logo"></i>
            <h2 class="fw-bold text-dark mb-0">HealthTICloud</h2>
            <p class="text-muted-modern small">Sistema de Información Radiológica</p>
        </div>

        <div class="card-body p-4 pt-2">
            <div id="loginError" class="alert alert-danger d-none small p-2 text-center fw-bold rounded-3"></div>

            <div class="mb-3">
                <label class="small fw-bold text-muted-modern mb-1" for="username">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                    <input id="username" type="text" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="small fw-bold text-muted-modern mb-1" for="password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                    <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                    <label class="form-check-label small text-muted-modern" for="rememberMe">
                        Recordarme
                    </label>
                </div>
                <a href="#" class="small text-primary fw-bold" onclick="mostrarModalRecuperar()">¿Olvidó su
                    contraseña?</a>
            </div>

            <button id="loginBtn" class="btn btn-primary login-btn w-100 shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> INICIAR SESIÓN
            </button>
        </div>

        <div class="card-footer bg-white border-0 text-center pb-3 pt-0">
            <small class="text-muted" style="font-size: 0.75rem;">© 2026 Procomed. Todos los derechos
                reservados.</small>
        </div>
    </div>
    <div class="modal fade" id="modalRecuperarPassword" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h6 class="modal-title fw-bold">Recuperar Acceso</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">Ingrese su correo oficial para recibir instrucciones.</p>
                    <input type="email" id="emailRecuperar" class="form-control form-control-sm"
                        placeholder="usuario@clinica.cl">
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-sm btn-primary w-100 fw-bold"
                        onclick="enviarSolicitudRecuperacion()">
                        Enviar Instrucciones
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
