<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIS - Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .card-recovery {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="card card-recovery shadow-lg p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                    <h4 class="fw-bold mt-2">Nueva Contraseña</h4>
                    <p class="text-muted small">Ingrese su nueva clave de acceso</p>
                </div>

                <form id="formRecovery">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nueva Contraseña</label>
                        <input type="password" id="newPassword" class="form-control" required
                            placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" class="form-control" required
                            placeholder="Repita la contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btnReset">
                        Actualizar Contraseña
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="login.html" class="small text-decoration-none text-muted">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const API_URL = "http://tu-api-url.com/api"; // Ajusta tu URL

        $("#formRecovery").on("submit", async function (e) {
            e.preventDefault();

            const pass = $("#newPassword").val();
            const conf = $("#confirmPassword").val();

            if (pass.length < 6) return alert("La contraseña es muy corta.");
            if (pass !== conf) return alert("Las contraseñas no coinciden.");

            // Obtener parámetros de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            if (!token || !email) return alert("Enlace inválido o expirado.");

            const $btn = $("#btnReset");
            $btn.prop("disabled", true).text("Procesando...");

            try {
                const response = await fetch(`${API_URL}/password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        email: email,
                        password: pass,
                        password_confirmation: conf
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert("✅ Contraseña actualizada. Ya puede iniciar sesión.");
                    window.location.href = "login.html";
                } else {
                    alert("❌ Error: " + (data.message || "No se pudo restablecer."));
                    $btn.prop("disabled", false).text("Actualizar Contraseña");
                }
            } catch (error) {
                alert("Error de conexión");
                $btn.prop("disabled", false).text("Actualizar Contraseña");
            }
        });
    </script>
</body>

</html>
