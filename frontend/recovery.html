<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIS - Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #f4f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card-recovery {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="card card-recovery shadow-lg p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;" aria-hidden="true"></i>
                    <h4 class="fw-bold mt-2">Nueva Contraseña</h4>
                    <p class="text-muted small">Ingrese su nueva clave de acceso</p>
                </div>

                <div id="recoveryError" class="alert alert-danger d-none small" role="alert"></div>

                <form id="formRecovery">
                    <div class="mb-3">
                        <label class="form-label small fw-bold" for="newPassword">Nueva Contraseña</label>
                        <input type="password" id="newPassword" class="form-control" required
                            placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold" for="confirmPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" class="form-control" required
                            placeholder="Repita la contraseña" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btnReset">
                        Actualizar Contraseña
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="index.html" class="small text-decoration-none text-muted">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script>
        $("#formRecovery").on("submit", async function (e) {
            e.preventDefault();

            const pass = $("#newPassword").val();
            const conf = $("#confirmPassword").val();
            $("#recoveryError").addClass("d-none");

            if (pass.length < 6) {
                $("#recoveryError").removeClass("d-none").text("La contraseña debe tener al menos 6 caracteres.");
                return;
            }
            if (pass !== conf) {
                $("#recoveryError").removeClass("d-none").text("Las contraseñas no coinciden.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            if (!token || !email) {
                $("#recoveryError").removeClass("d-none").text("Enlace inválido o expirado.");
                return;
            }

            const $btn = $("#btnReset");
            $btn.prop("disabled", true).text("Procesando...");

            try {
                const response = await fetch(`${API_URL}/password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        email: email,
                        password: pass,
                        password_confirmation: conf
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showToast("Contraseña actualizada. Ya puede iniciar sesión.", "success");
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);
                } else {
                    $("#recoveryError").removeClass("d-none").text(data.message || "No se pudo restablecer.");
                    $btn.prop("disabled", false).text("Actualizar Contraseña");
                }
            } catch (error) {
                $("#recoveryError").removeClass("d-none").text("Error de conexión con el servidor.");
                $btn.prop("disabled", false).text("Actualizar Contraseña");
            }
        });
    </script>
</body>

</html>
