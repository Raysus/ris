<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTICloud — Restablecer contraseña</title>
    <meta name="theme-color" content="#101860">
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="assets/brand/healthticloud-logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/brand/healthticloud-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=20260602">
</head>

<body class="recovery-page">

    <div class="card card-recovery shadow-lg">
        <div class="recovery-header text-center">
            <div class="recovery-brand-panel">
                <img src="assets/brand/healthticloud-logo.png?v=20260601" alt="HealthTICloud" class="recovery-brand-img" width="300" height="72" decoding="async">
            </div>
            <h4 class="fw-bold text-primary mt-2 mb-1 px-4">Nueva contraseña</h4>
            <p class="recovery-subtitle mb-0">Ingrese su nueva clave de acceso</p>
        </div>

        <div class="card-body p-4 pt-2">

                <div id="recoveryError" class="alert alert-danger d-none small" role="alert"></div>

            <form id="formRecovery">
                <div class="mb-3">
                    <label class="small fw-bold text-muted-modern mb-1" for="newPassword">Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                        <input type="password" id="newPassword" class="form-control" required
                            placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <button type="button" class="btn password-toggle-btn" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="small fw-bold text-muted-modern mb-1" for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
                        <input type="password" id="confirmPassword" class="form-control" required
                            placeholder="Repita la contraseña" autocomplete="new-password">
                        <button type="button" class="btn password-toggle-btn" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary login-btn w-100 shadow-sm" id="btnReset">
                    <i class="bi bi-check2-circle me-2" aria-hidden="true"></i>Actualizar Contraseña
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="index.html" class="small fw-semibold text-primary text-decoration-none">Volver al inicio</a>
            </div>
        </div>

        <div class="card-footer login-footer border-0 text-center pb-3 pt-0">
            <small>© 2026 Procomed. Todos los derechos reservados.</small>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js?v=20260616d"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/password-toggle.js"></script>
    <script>
        $("#formRecovery").on("submit", async function (e) {
            e.preventDefault();

            const pass = $("#newPassword").val();
            const conf = $("#confirmPassword").val();
            $("#recoveryError").addClass("d-none");

            if (pass.length < 8) {
                $("#recoveryError").removeClass("d-none").text("La contraseña debe tener al menos 8 caracteres.");
                return;
            }
            if (pass !== conf) {
                $("#recoveryError").removeClass("d-none").text("Las contraseñas no coinciden.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            if (!token || !email) {
                $("#recoveryError").removeClass("d-none").text("Enlace inválido o expirado.");
                return;
            }

            const $btn = $("#btnReset");
            $btn.prop("disabled", true).text("Procesando...");

            try {
                const response = await fetch(`${API_URL}/password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        email: email,
                        password: pass,
                        password_confirmation: conf
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showToast("Contraseña actualizada. Ya puede iniciar sesión.", "success");
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);
                } else {
                    $("#recoveryError").removeClass("d-none").text(data.message || "No se pudo restablecer.");
                    $btn.prop("disabled", false).text("Actualizar Contraseña");
                }
            } catch (error) {
                $("#recoveryError").removeClass("d-none").text("Error de conexión con el servidor.");
                $btn.prop("disabled", false).text("Actualizar Contraseña");
            }
        });
    </script>
</body>

</html>
