# PACS Orthanc vía ris-nube (Tailscale / LAN housing).
# TLS: mkcert en /etc/ssl/mkcert (confiable en estaciones con rootCA instalada).

server {
    listen 443 ssl;
    server_name pacs.healthticloud.cl;

    ssl_certificate     /etc/ssl/mkcert/pacs.healthticloud.cl.crt;
    ssl_certificate_key /etc/ssl/mkcert/pacs.healthticloud.cl.key;

    # Tailscale (ThinkCentre, Fer, labs)
    allow 100.64.0.0/10;
    # WireGuard VasquezIT (cualquier PC con VPN)
    allow 10.0.0.0/24;
    # LAN housing Orthanc
    allow 172.16.66.0/24;
    allow 127.0.0.0/8;
    deny all;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://viewer.healthticloud.cl";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, Cache-Control";
            add_header Access-Control-Max-Age "86400";
            return 204;
        }

        proxy_pass http://172.16.66.11:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "https://viewer.healthticloud.cl" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        proxy_read_timeout 300s;
        client_max_body_size 512M;
    }
}
